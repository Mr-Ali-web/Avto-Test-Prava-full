services:
  bot:
    build: .
    container_name: pravaga_bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/pravaga.db
    volumes:
      - ./storage:/data          # baza shu yerda saqlanadi (yangilashda yo'qolmaydi)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
